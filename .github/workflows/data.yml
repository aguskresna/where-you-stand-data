# The daily data job. Free on GitHub's standard runners when this repository is public.
# Setup (once): add the repository secret CLOUDFLARE_API_TOKEN (a token with "Cloudflare Pages: Edit")
# and the repository variables CLOUDFLARE_ACCOUNT_ID and PAGES_PROJECT (the project name; the job
# creates the Pages project the first time). Optional variable PAGES_URL: the site address, if it
# isn't https://<project>.pages.dev/. Until the token is added, the job builds and commits data but
# skips deploying.
name: Update data

on:
  schedule:
    - cron: "23 2 * * *" # every day at 02:23 UTC (10:23 in Kuala Lumpur)
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every source even if nothing changed
        type: boolean
        default: false
      sources:
        description: Only these source ids, separated by spaces (blank for all)
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      PROJECT: ${{ vars.PAGES_PROJECT || 'hall-of-ranks-data' }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r requirements.txt

      - name: Check the question catalog
        run: python -m statsapp_pipeline questions

      - name: Rebuild only what changed
        id: update
        run: python -m statsapp_pipeline update ${{ inputs.sources }} ${{ inputs.force && '--force' || '' }}

      - name: Publish the site
        run: python -m statsapp_pipeline publish --out ../site

      - name: Save built data and fingerprints
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state
          if ! git diff --cached --quiet; then
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Note that deploying is waiting for the Cloudflare token
        if: env.CAN_DEPLOY != 'true'
        run: echo "::warning::Not deployed. Add the repository secret CLOUDFLARE_API_TOKEN (see the top of data.yml)."

      # The first run creates the Pages project; later runs find it already there.
      - name: Create the Cloudflare Pages project if it's new
        if: env.CAN_DEPLOY == 'true'
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list 2>&1 | grep -qw "$PROJECT"; then
            echo "Project $PROJECT exists"
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        if: env.CAN_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ env.PROJECT }} --branch=main

      # Fails the run (and GitHub emails you) if the live site doesn't serve the index.
      - name: Check the live site
        if: env.CAN_DEPLOY == 'true'
        working-directory: .
        env:
          SITE: ${{ vars.PAGES_URL || format('https://{0}.pages.dev/', vars.PAGES_PROJECT || 'hall-of-ranks-data') }}
        run: |
          sleep 20
          curl -fsS --retry 6 --retry-delay 15 --retry-all-errors "${SITE%/}/index.json" -o live-index.json
          python -c "import json; i = json.load(open('live-index.json')); print(len(i['datasets']), 'datasets live, generated', i['generated'])"

      # GitHub switches off schedules in public repositories after 60 days without activity.
      - name: Keep the schedule alive
        working-directory: .
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 45 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > state/heartbeat.txt
            git add state/heartbeat.txt
            git commit -m "Keep the daily data job scheduled"
            git push
          fi

      # Runs last so whatever did build is still deployed; GitHub emails you when a run fails.
      - name: Report sources that failed
        if: steps.update.outputs.failed != ''
        run: |
          echo "::error::These sources failed: ${{ steps.update.outputs.failed }}. See the run summary."
          exit 1
