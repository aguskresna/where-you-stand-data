# The daily data job. Free on GitHub's standard runners when this repository is public.
# Setup (once): create a Cloudflare Pages project, then add repository secrets
#   CLOUDFLARE_API_TOKEN  (a token with "Cloudflare Pages: Edit")
#   CLOUDFLARE_ACCOUNT_ID
# and optionally repository variables PAGES_PROJECT (the project name) and PAGES_URL (the site address,
# if it isn't https://<project>.pages.dev/).
name: Update data

on:
  schedule:
    - cron: "23 2 * * *" # every day at 02:23 UTC (10:23 in Kuala Lumpur)
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every source even if nothing changed
        type: boolean
        default: false
      sources:
        description: Only these source ids, separated by spaces (blank for all)
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r requirements.txt

      - name: Check the question catalog
        run: python -m statsapp_pipeline questions

      - name: Rebuild only what changed
        id: update
        run: python -m statsapp_pipeline update ${{ inputs.sources }} ${{ inputs.force && '--force' || '' }}

      - name: Publish the site
        run: python -m statsapp_pipeline publish --out ../site

      - name: Save built data and fingerprints
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state
          if ! git diff --cached --quiet; then
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.PAGES_PROJECT || 'where-you-stand-data' }} --branch=main

      # Fails the run (and GitHub emails you) if the live site doesn't serve the index.
      - name: Check the live site
        working-directory: .
        env:
          SITE: ${{ vars.PAGES_URL || format('https://{0}.pages.dev/', vars.PAGES_PROJECT || 'where-you-stand-data') }}
        run: |
          sleep 20
          curl -fsS --retry 6 --retry-delay 15 --retry-all-errors "${SITE%/}/index.json" -o live-index.json
          python -c "import json; i = json.load(open('live-index.json')); print(len(i['datasets']), 'datasets live, generated', i['generated'])"

      # GitHub switches off schedules in public repositories after 60 days without activity.
      - name: Keep the schedule alive
        working-directory: .
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 45 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > state/heartbeat.txt
            git add state/heartbeat.txt
            git commit -m "Keep the daily data job scheduled"
            git push
          fi

      # Runs last so whatever did build is still deployed; GitHub emails you when a run fails.
      - name: Report sources that failed
        if: steps.update.outputs.failed != ''
        run: |
          echo "::error::These sources failed: ${{ steps.update.outputs.failed }}. See the run summary."
          exit 1
